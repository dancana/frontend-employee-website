{% extends 'base.html' %}

{% block content %}
<h2>Employees</h2>
<table>
    <tr>
        <th>Name</th>
        <th>Employee ID</th>
        <th>Department</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>
    {% for employee in employees %}
    <tr>
        <td>{{ employee.name }}</td>
        <td>{{ employee.emp_id }}</td>
        <td>{{ employee.department }}</td>
        <td>{{ employee.role }}</td>
        <td>
            <a href="{{ url_for('update_employee', id=employee.id) }}">Edit</a> |
            <a href="{{ url_for('delete_employee', id=employee.id) }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
